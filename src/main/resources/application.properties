# =============================================================================
# Configuración de SICA. Los valores por defecto coinciden con docker-compose.yml.
# =============================================================================
db.url=jdbc:mysql://localhost:3306/sica_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
db.user=sica_user
db.password=sica_pass
db.driver=com.mysql.cj.jdbc.Driver

# Cada cuántos segundos las ventanas consultan cambios en la BD (Observer + polling).
ui.refresh.seconds=2

# Tema visual (FlatLaf Light / Dark).
ui.theme=light
